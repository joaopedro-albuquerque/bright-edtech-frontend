name: Deploy Frontend

on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  S3_BUCKET: prod-brightedtech-frontend-cf-818651033737
  CLOUDFRONT_DISTRIBUTION_ID: E1GZDEJADF7JN

permissions:
  contents: read

jobs:
  deploy:
    name: Build e Deploy pro S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependências
        run: |
          npm install react-joyride@2.9.3 --save --legacy-peer-deps
          npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sincronizar dist/ com o S3
        run: |
          aws s3 sync ./dist "s3://$S3_BUCKET" --delete --exclude "videos/*"

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Resumo
        run: |
          echo "Deploy concluído. Site disponível em https://brightedtech.com.br"