name: Qualidade Frontend

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

env:
  AUDIT_BASE_URL: https://brightedtech.com.br

jobs:
  usability:
    name: Lighthouse e axe
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Instalar Chrome compatível com o axe
        run: npx --yes browser-driver-manager install chrome

      - name: Auditar páginas públicas
        run: npm run audit:usability

      - name: Publicar relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-usability-report
          path: audits/
          if-no-files-found: warn

      - name: Resumo
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';

          let data;
          try {
            data = JSON.parse(await readFile('audits/summary.json', 'utf8'));
          } catch {
            console.log('## Usabilidade');
            console.log();
            console.log('Não foi possível ler `audits/summary.json`.');
            process.exit(0);
          }

          console.log('## Usabilidade');
          console.log();
          console.log(`Site: ${data.baseUrl}`);
          console.log();
          console.log('| Rota | Acessibilidade | Violações do axe |');
          console.log('| --- | ---: | ---: |');
          for (const row of data.routes) {
            const score = row.accessibility == null ? '—' : String(row.accessibility);
            console.log(`| \`${row.route}\` | ${score} | ${row.axeViolations} |`);
          }
          console.log();
          console.log('Baixe o artifact `frontend-usability-report` e abra `index.html`.');
          JS
